name: Web

on:
  push:
    paths:
      - "app.js"
      - "server/**"
      - "shared/**"
      - "public/**"
      - "views/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "app.js"
      - "server/**"
      - "shared/**"
      - "public/**"
      - "views/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
