        ctx.arc(cx, cy, box.w, -Math.PI / 2 + done * Math.PI * 2, -Math.PI / 2 + Math.PI * 2);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.font = Game.uiFont(18);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🏛️", cx, cy);
    }
  }
}

/**
 * Owns the loop: income, bot buys, movement/combat, capture, rendering, input.
 */
const Game = {
  canvas: null,
  ctx: null,
  ui: {},
  player: null,
  enemy: null,
  checkpoints: [],
  projectiles: [],
  splats: [],
  drag: null,
  nextTroopId: 1,
  winner: null,
  elapsed: 0,
  lastTime: 0,
  cssScale: 1,
  hover: null,

  /** Build sides, place the five bottom checkpoints, and bind controls. */
  init() {
    this.canvas = document.getElementById("board");
    this.ctx = this.canvas.getContext("2d");
    this.hover = null;
    this.ui = {
      banner: document.getElementById("banner"),
      bannerText: document.getElementById("banner-text"),
      restart: document.getElementById("restart"),
    };
    this.fitCanvas();
    this.reset();
    this.bindUI();
    this.lastTime = performance.now();
    requestAnimationFrame((t) => this.loop(t));
  },

  /** Letterbox the board into the stage and keep a sharp backing store. */
  fitCanvas() {
    const stage = this.canvas.parentElement;
    const availW = Math.max(1, stage.clientWidth);
    const availH = Math.max(1, stage.clientHeight);
    const aspect = CONFIG.canvasWidth / CONFIG.canvasHeight;
    let cssW = availW;
    let cssH = cssW / aspect;
    if (cssH > availH) {
      cssH = availH;
      cssW = cssH * aspect;
    }
    this.canvas.style.width = `${cssW}px`;
    this.canvas.style.height = `${cssH}px`;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    this.canvas.width = Math.round(CONFIG.canvasWidth * dpr);
    this.canvas.height = Math.round(CONFIG.canvasHeight * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cssScale = cssW / CONFIG.canvasWidth;
  },

  isTouchUi() {
    return window.matchMedia("(pointer: coarse)").matches
      || (navigator.maxTouchPoints || 0) > 0;
  },

  uiFont(px, weight) {
    const size = Math.round(px * CONFIG.uiScale);
    return `${weight || "bold"} ${size}px Trebuchet MS, sans-serif`;
  },

  /** Drawn control sizes plus extra hit padding so taps reach 44 CSS px. */
  uiMetrics() {
    const scale = this.cssScale || 1;
    const grow = CONFIG.uiScale;
    const tap = CONFIG.touchTargetPx / scale;
    const coarse = this.isTouchUi();
    const buyH = (coarse
      ? Math.min(34, Math.max(CONFIG.buyButtonH, tap * 0.55))
      : CONFIG.buyButtonH) * grow;
    const buyW = (coarse ? Math.max(CONFIG.buyButtonW, 108) : CONFIG.buyButtonW) * grow;
    const bank = (coarse
      ? Math.min(46, Math.max(CONFIG.bankButtonSize, tap * 0.65))
      : CONFIG.bankButtonSize) * grow;
    return {
      buyW,
      buyH,
      buyGap: (coarse ? 8 : CONFIG.buyButtonGap) * grow,
      bank,
      bankGap: (coarse ? 8 : CONFIG.bankButtonGap) * grow,
      hitPad: Math.max(6, (CONFIG.touchTargetPx / scale - Math.min(buyH, bank)) / 2),
      unitReach: Math.max(10, 24 / scale),
      townReach: Math.max(12, 24 / scale),
      dragMin: Math.max(CONFIG.laneDragMin, 20 / scale),
    };
  },

  pointInBox(point, box, pad) {
    const extra = pad || 0;
    return point.x >= box.x - extra && point.x <= box.x + box.w + extra
      && point.y >= box.y - extra && point.y <= box.y + box.h + extra;
  },

  /** Restore a fresh match. Kept as a method so rematches and later modes can reuse it. */
  reset() {
    this.player = new Side("player", CONFIG.playerCapital);
    this.enemy = new Side("enemy", CONFIG.enemyCapital);
    this.checkpoints = [];
    this.projectiles = [];
    this.splats = [];
    this.drag = null;
    this.nextTroopId = 1;
    this.winner = null;
    this.elapsed = 0;

    const center = Path.bottomCenter();
    const midR = Path.bottomRadius(Math.floor(CONFIG.bottomSublaneCount / 2));
    const count = CONFIG.checkpointCount;
    for (let i = 0; i < count; i += 1) {
      const t = (i + 1) / (count + 1);
      const theta = Math.PI * (1 - t);
      this.checkpoints.push(new Checkpoint(
        i,
        center.x + midR * Math.cos(theta),
        center.y + midR * Math.sin(theta),
      ));
    }
    this.refreshIncomes();
    this.ui.banner.classList.add("hidden");
  },

  /** Shared player-buy path for melee, skirmisher, dragoon, and cannon. */
  buy(lane, type) {
    ShotTone.unlock();
    if (this.winner) {
      return;
    }
    if (this.player.tryBuy(lane, this.nextTroopId, type)) {
      this.nextTroopId += 1;
    }
  },

  /** Restart is the only remaining HTML control. */
  bindUI() {
    this.ui.restart.addEventListener("click", () => {
      this.reset();
    });
    const opts = { passive: false };
    this.canvas.addEventListener("pointerdown", (event) => {
      ShotTone.unlock();
      this.onPointerDown(event);
    }, opts);
    this.canvas.addEventListener("pointermove", (event) => {
      this.onPointerMove(event);
    }, opts);
    this.canvas.addEventListener("pointerup", (event) => {
      this.onPointerUp(event);
    }, opts);
    this.canvas.addEventListener("pointercancel", () => {
      this.drag = null;
    });
    this.canvas.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });
    const refit = () => this.fitCanvas();
    window.addEventListener("resize", refit);
    window.addEventListener("orientationchange", refit);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", refit);
    }
  },

  /** Map a pointer onto logical canvas pixels (CSS size and DPR independent). */
  canvasPoint(event) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: (event.clientX - rect.left) * (CONFIG.canvasWidth / rect.width),
      y: (event.clientY - rect.top) * (CONFIG.canvasHeight / rect.height),
    };
  },

  /** Closest friendly troop under the cursor, or null. */
  hitTroop(event) {
    const point = this.canvasPoint(event);
    let best = null;
    let bestD = Infinity;
    for (let i = 0; i < this.player.troops.length; i += 1) {
      const troop = this.player.troops[i];
      const reach = troop.bodyRadius() + this.uiMetrics().unitReach;
      const d = distance(point, troop);
      if (d <= reach && d < bestD) {
        bestD = d;
        best = troop;
      }
    }
    return best;
  },

  /**
   * Left-press on a friendly starts a possible drag-to-row. A short
   * press still issues reform / halt / advance.
   */
  onPointerDown(event) {
    if (this.winner || !event.isPrimary) {
      return;
    }
    if (event.pointerType === "mouse" && event.button !== 0) {
      return;
    }
    event.preventDefault();
    const point = this.canvasPoint(event);
    const buy = this.hitBuyAt(point);
    if (buy) {
      this.buy(buy.lane, buy.type);
      return;
    }
    if (this.hitBankAt(point, this.player)) {
      this.player.tryUnlockBank();
      return;
    }
    const troop = this.hitTroop(event);
    if (!troop) {
      return;
    }
    this.drag = { troop, x: point.x, y: point.y, hx: point.x, hy: point.y };
    this.canvas.setPointerCapture(event.pointerId);
  },

  /** While dragging, keep the hover point so the target row can light up. */
  onPointerMove(event) {
    if (!event.isPrimary) {
      return;
    }
    event.preventDefault();
    const point = this.canvasPoint(event);
    this.hover = point;
    if (this.drag) {
      this.drag.hx = point.x;
      this.drag.hy = point.y;
    }
    const overUI = this.hitBuyAt(point) || this.hitBankAt(point, this.player);
    this.canvas.style.cursor = overUI ? "pointer" : "default";
  },

  /** True when the cursor is on this side's next bank button. */
  hitBank(event, side) {
    return this.hitBankAt(this.canvasPoint(event), side);
  },

  hitBankAt(point, side) {
    if (side.banks >= CONFIG.bankCount) {
      return false;
    }
    const box = side.bankButtonRect(side.banks);
    return this.pointInBox(point, box, this.uiMetrics().hitPad);
  },

  hitBuyAt(point) {
    const pad = this.uiMetrics().hitPad;
    const lanes = ["top", "bottom"];
    let best = null;
    let bestD = Infinity;
    for (let L = 0; L < lanes.length; L += 1) {
      for (let i = 0; i < BUY_UNITS.length; i += 1) {
        const box = this.buyButtonRect(lanes[L], i);
        if (!this.pointInBox(point, box, pad)) {
          continue;
        }
        const d = distance(point, { x: box.x + box.w / 2, y: box.y + box.h / 2 });
        if (d < bestD) {
          bestD = d;
          best = { lane: lanes[L], type: BUY_UNITS[i].type };
        }
      }
    }
    return best;
  },

  /**
   * Centered buy rows in the open gap: top row under the top lane,
   * bottom row above the rings, with a tight space between them.
   */
  buyRowLayout() {
    const ui = this.uiMetrics();
    const row = BUY_UNITS.length * ui.buyW + (BUY_UNITS.length - 1) * ui.buyGap;
    const x = CONFIG.canvasWidth / 2 - row / 2;
    const pad = 12;
    const pairGap = 14;
    const minTop = CONFIG.playerCapital.y + CONFIG.topLaneHeight / 2 + pad;
    const c = Path.bottomCenter();
    const rIn = Path.bottomRadius(CONFIG.bottomSublaneCount - 1);
    const dx = Math.min(row / 2, rIn - 8);
    const ringY = c.y + Math.sqrt(Math.max(0, rIn * rIn - dx * dx));
    const maxBottom = ringY - pad - ui.buyH;
    const pairH = ui.buyH * 2 + pairGap;
    let topY = (minTop + maxBottom + ui.buyH - pairH) / 2;
    topY = Math.max(minTop, Math.min(topY, maxBottom - pairGap - ui.buyH));
    return { x, topY, bottomY: topY + ui.buyH + pairGap, ui };
  },

  buyButtonOrigin(lane) {
    const layout = this.buyRowLayout();
    return { x: layout.x, y: lane === "top" ? layout.topY : layout.bottomY };
  },

  buyButtonRect(lane, index) {
    const layout = this.buyRowLayout();
    const ui = layout.ui;
    return {
      x: layout.x + index * (ui.buyW + ui.buyGap),
      y: lane === "top" ? layout.topY : layout.bottomY,
      w: ui.buyW,
      h: ui.buyH,
    };
  },

  /** Owned town under the cursor, or null. */
  hitCheckpoint(event) {
    const point = this.canvasPoint(event);
    let best = null;
    let bestD = Infinity;
    for (let i = 0; i < this.checkpoints.length; i += 1) {
      const town = this.checkpoints[i];
      const d = distance(point, town);
      if (d <= town.radius() + this.uiMetrics().townReach && d < bestD) {
        bestD = d;
        best = town;
      }
    }
    return best;
  },

  /**
   * Classify a drag as a row change, a forward charge, or a fallback.
   * Along-the-path wins over a slight sideways drift.
   */
  dragIntent(troop, from, to) {
    const tan = Path.tangentAt(troop.points, troop.progress);
    const dx = to.x - from.x;
    const dy = to.y - from.y;
    const along = dx * tan.x + dy * tan.y;
    const across = dx * -tan.y + dy * tan.x;
    const row = Path.closestSublane(troop.side.id, troop.lane, troop.progress, to);
    if (Math.abs(across) > Math.abs(along) && row !== troop.sublane) {
      return { kind: "lane", row };
    }
    if (along > 0) {
      return { kind: "charge" };
    }
    if (along < 0) {
      return { kind: "fallback" };
    }
    return { kind: "none" };
  },

  /**
   * Left-release: drag across to change row, forward to charge, back
   * to fall back, click to cycle reform / halt / advance, or click a
   * town you own to buy its upgrade. Only fallback works in melee.
   */
  onPointerUp(event) {
    if (!event.isPrimary) {
      return;
    }
    if (event.pointerType === "mouse" && event.button !== 0) {
      return;
    }
    if (!this.drag) {
      if (this.winner) {
        return;
      }
      const town = this.hitCheckpoint(event);
      if (town && town.owner === "player") {
        this.player.tryBuyUpgrade(town.upgradeKind());
      }
      return;
    }
    const start = this.drag;
    this.drag = null;
    if (this.winner || start.troop.hp <= 0) {
      return;
    }
    const allies = this.player.troops;
    const enemies = this.enemy.troops;
    const point = this.canvasPoint(event);
    const pulled = distance(start, point);
    if (pulled >= this.uiMetrics().dragMin) {
      const intent = this.dragIntent(start.troop, start, point);
      if (intent.kind === "fallback") {
        start.troop.issueFallback(allies);
        return;
      }
      if (start.troop.lineInMelee(allies, enemies)) {
        return;
      }
      if (intent.kind === "lane") {
        start.troop.issueLaneChange(intent.row, allies, enemies);
        return;
      }
      if (intent.kind === "charge") {
        start.troop.issueCharge(allies, enemies);
        return;
      }
    }
    start.troop.issueOrder(allies, enemies);
  },

  /**
   * Bot action: spend gold on a unit in the lane where its center-line
   * share is smaller (ties: top). An empty lane always gets a troop
   * first. If it already has more troops there than the player, it
   * saves for a dragoon. If a bank is available and it leads army
   * value in both lanes, it saves for the bank.
   */
  botAct() {
    this.botFormLines();
    this.botChargeDragoons();
    this.botBuyUpgrades();
    const emptyLane = this.botLaneMissingTroop();
    if (emptyLane) {
      if (this.enemy.tryBuy(emptyLane, this.nextTroopId, "melee")) {
        this.nextTroopId += 1;
      }
      return;
    }
    if (this.botShouldSaveForBank()) {
      this.enemy.tryUnlockBank();
      return;
    }
    const topShare = 1 - this.topLaneCenterT();
    const bottomShare = 1 - this.bottomLaneCenterT();
    const lane = bottomShare < topShare ? "bottom" : "top";
    if (this.enemy.countInLane(lane) > this.player.countInLane(lane)) {
      if (this.enemy.tryBuy(lane, this.nextTroopId, "dragoon")) {
        this.nextTroopId += 1;
      }
      this.enemy.tryUnlockBank();
      return;
    }
    if (this.enemy.gold < CONFIG.troopCost) {
      this.enemy.tryUnlockBank();
      return;
    }
    if (this.enemy.tryBuy(lane, this.nextTroopId, "melee")) {
      this.nextTroopId += 1;
    }
    this.enemy.tryUnlockBank();
  },

  /**
   * Lane with no living bot melee troop. If both are empty, use the
   * weaker center-line share (ties: top).
   */
  botLaneMissingTroop() {
    const topEmpty = this.enemy.countTypeInLane("top", "melee") === 0;
    const bottomEmpty = this.enemy.countTypeInLane("bottom", "melee") === 0;
    if (!topEmpty && !bottomEmpty) {
      return null;
    }
    if (topEmpty && !bottomEmpty) {
      return "top";
    }
    if (bottomEmpty && !topEmpty) {
      return "bottom";
    }
    const topShare = 1 - this.topLaneCenterT();
    const bottomShare = 1 - this.bottomLaneCenterT();
    return bottomShare < topShare ? "bottom" : "top";
  },

  /**
   * Bot dragoon (and dragoon-line) orders, first match:
   * no troop within 100 → fallback; enemy within 100 → charge;
   * troop within 100 behind → reform; otherwise advance.
   */
  botChargeDragoons() {
    const allies = this.enemy.troops;
    const foes = this.player.troops;
    const seen = {};
    for (let i = 0; i < allies.length; i += 1) {
      const troop = allies[i];
      if (troop.hp <= 0 || troop.type !== "dragoon" || seen[troop.id]) {
        continue;
      }
      const line = troop.lineGroup(allies);
      const lead = troop.sortRearToFront(line)[line.length - 1];
      const next = this.botDragoonOrder(lead, allies, foes);
      let locked = false;
      for (let g = 0; g < line.length; g += 1) {
        seen[line[g].id] = true;
        if (line[g].order !== next && line[g].orderLock > 0) {
          locked = true;
        }
      }
      if (locked) {
        continue;
      }
      for (let g = 0; g < line.length; g += 1) {
        this.botSetOrder(line[g], next);
      }
    }
  },

  /** Apply an order if it changed and the bot lock has expired. */
  botSetOrder(troop, next) {
    if (troop.order === next || troop.orderLock > 0) {
      return false;
    }
    troop.order = next;
    troop.reformNeedsAlign = next === "reform";
    troop.wantedSublane = null;
    troop.orderLock = CONFIG.botOrderCooldown;
    return true;
  },

  /** Pick fallback, charge, reform, or advance (null) for a bot dragoon. */
  botDragoonOrder(dragoon, allies, foes) {
    const range = CONFIG.dragoonSupportRange;
    if (this.dragoonHasTroopAhead(dragoon, allies)) {
      return null;
    }
    if (!this.dragoonHasTroopNear(dragoon, allies, range)) {
      return "fallback";
    }
    if (this.dragoonHasEnemyNear(dragoon, foes, range)) {
      return "charge";
    }
    if (this.dragoonHasTroopBehind(dragoon, allies, range)) {
      return "reform";
    }
    return null;
  },

  /** Friendly troop ahead of this dragoon, any sublane of the same lane. */
  dragoonHasTroopAhead(dragoon, allies) {
    for (let i = 0; i < allies.length; i += 1) {
      const ally = allies[i];
      if (ally.hp <= 0 || ally === dragoon || ally.type !== "melee") {
        continue;
      }
      if (ally.lane !== dragoon.lane) {
        continue;
      }
      if (dragoon.alongSigned(ally) > 0) {
        return true;
      }
    }
    return false;
  },

  dragoonHasTroopNear(dragoon, allies, range) {
    for (let i = 0; i < allies.length; i += 1) {
      const ally = allies[i];
      if (ally.hp <= 0 || ally === dragoon || ally.type !== "melee") {
        continue;
      }
      if (distance(dragoon, ally) <= range) {
        return true;
      }
    }
    return false;
  },

  dragoonHasEnemyNear(dragoon, foes, range) {
    for (let i = 0; i < foes.length; i += 1) {
      const foe = foes[i];
      if (foe.hp <= 0) {
        continue;
      }
      if (distance(dragoon, foe) <= range) {
        return true;
      }
    }
    return false;
  },

  dragoonHasTroopBehind(dragoon, allies, range) {
    for (let i = 0; i < allies.length; i += 1) {
      const ally = allies[i];
      if (ally.hp <= 0 || ally === dragoon || ally.type !== "melee") {
        continue;
      }
      if (dragoon.alongSigned(ally) >= 0) {
        continue;
      }
      if (distance(dragoon, ally) <= range) {
        return true;
      }
    }
    return false;
  },

  /**
   * True when the next bank is time-unlocked and the bot's living
   * unit gold-value is ahead in both lanes.
   */
  botShouldSaveForBank() {
    const bot = this.enemy;
    if (bot.banks >= CONFIG.bankCount || !bot.bankUnlockedByTime(bot.banks)) {
      return false;
    }
    return this.laneArmyValue(bot, "top") > this.laneArmyValue(this.player, "top")
      && this.laneArmyValue(bot, "bottom") > this.laneArmyValue(this.player, "bottom");
  },

  /**
   * If a lane has more than one bot troop, only a lone leader that is
   * ahead of an adjacent follower reforms. Troops that can walk up into
   * a line already ahead keep advancing, as do already-formed lines.
   */
  botFormLines() {
    const allies = this.enemy.troops;
    const foes = this.player.troops;
    const lanes = ["top", "bottom"];
    for (let L = 0; L < lanes.length; L += 1) {
      const lane = lanes[L];
      let count = 0;
      for (let i = 0; i < allies.length; i += 1) {
        if (allies[i].hp > 0 && allies[i].lane === lane) {
          count += 1;
        }
      }
      if (count < 2) {
        continue;
      }
      for (let i = 0; i < allies.length; i += 1) {
        const troop = allies[i];
        if (troop.hp <= 0 || troop.lane !== lane || troop.type === "dragoon") {
          continue;
        }
        if (troop.order === "charge" || troop.order === "halt" || troop.order === "fallback") {
          continue;
        }
        if (troop.lineInMelee(allies, foes)) {
          continue;
        }
        const line = troop.lineGroup(allies);
        if (line.length >= 2) {
          if (troop.order === "reform") {
            for (let g = 0; g < line.length; g += 1) {
              if (line[g].order === "reform") {
                this.botSetOrder(line[g], null);
              }
            }
          }
          continue;
        }
        if (troop.canJoinLineAhead(allies)) {
          if (troop.order === "reform") {
            this.botSetOrder(troop, null);
          }
          continue;
        }
        if (troop.order === "reform") {
          continue;
        }
        const partner = troop.nextBehindOtherSublane(allies);
        if (!partner) {
          continue;
        }
        this.botSetOrder(troop, "reform");
      }
    }
  },

  /**
   * Bot spends land on an owned town's upgrade when it can afford one.
   */
  botBuyUpgrades() {
    let best = null;
    let bestCost = Infinity;
    for (let i = 0; i < this.checkpoints.length; i += 1) {
      const town = this.checkpoints[i];
      if (town.owner !== "enemy") {
        continue;
      }
      const kind = town.upgradeKind();
      if (this.enemy.upgrades[kind] >= CONFIG.upgradeMax) {
        continue;
      }
      const cost = this.enemy.upgradeCost(kind);
      if (cost < bestCost && this.enemy.canBuyUpgrade(kind)) {
        bestCost = cost;
        best = kind;
      }
    }
    if (best) {
      this.enemy.tryBuyUpgrade(best);
    }
  },

  /**
   * Apply the live lane-center splits to gold and land income, then
   * award both for this step.
   */
  refreshIncomes() {
    const top = this.topLaneCenterT();
    const bottom = this.bottomLaneCenterT();
    this.player.refreshIncome(this.checkpoints, top);
    this.enemy.refreshIncome(this.checkpoints, 1 - top);
    this.player.refreshLand(bottom);
    this.enemy.refreshLand(1 - bottom);
  },

  /** Award passive gold and land from current income. */
  tickIncome(dt) {
    this.refreshIncomes();
    this.player.gold += this.player.income * dt;
    this.enemy.gold += this.enemy.income * dt;
    this.player.land += this.player.landIncome * dt;
    this.enemy.land += this.enemy.landIncome * dt;
  },

  /** Move, fight, capture, and drop dead troops for one side. */
  updateSide(side, opponents, enemySide, dt) {
    for (let i = 0; i < side.troops.length; i += 1) {
      const troop = side.troops[i];
      if (troop.hp <= 0) {
        continue;
      }
      troop.update(dt, side.troops, opponents, enemySide, this.projectiles);
      if (troop.lane === "bottom") {
        for (let c = 0; c < this.checkpoints.length; c += 1) {
          if (this.checkpoints[c].tryCapture(troop)) {
            this.refreshIncomes();
          }
        }
      }
    }
    side.troops = side.troops.filter((troop) => troop.hp > 0);
  },

  /** Create a floating damage number at a world point. */
  spawnSplat(x, y, amount, kind) {
    this.splats.push(new HitSplat(x, y, splatDamage(amount), kind));
  },

  /** Rise and drop expired hit splats. */
  updateSplats(dt) {
    for (let i = 0; i < this.splats.length; i += 1) {
      this.splats[i].update(dt);
    }
    this.splats = this.splats.filter((splat) => splat.alive);
  },

  /** Fly shells; they pass over units and only hit their locked target. */
  updateProjectiles(dt) {
    for (let i = 0; i < this.projectiles.length; i += 1) {
      this.projectiles[i].update(dt);
    }
    this.projectiles = this.projectiles.filter((shot) => shot.alive);
  },

  /** First capital to 0 HP loses; damage is cumulative across the match. */
  checkWinner() {
    if (this.enemy.capitalHP <= 0) {
      this.winner = "player";
      this.ui.bannerText.textContent = "Player wins";
      this.ui.banner.classList.remove("hidden");
    } else if (this.player.capitalHP <= 0) {
      this.winner = "enemy";
      this.ui.bannerText.textContent = "Bot wins";
      this.ui.banner.classList.remove("hidden");
    }
  },

  /** One simulation step: income, bot spend, both armies, shells, win check. */
  tick(dt) {
    if (this.winner) {
      return;
    }
    this.elapsed += dt;
    this.tickIncome(dt);
    this.botAct();
    this.updateSide(this.player, this.enemy.troops, this.enemy, dt);
    this.updateSide(this.enemy, this.player.troops, this.player, dt);
    this.player.updateGuns(dt, this.enemy.troops, this.player.troops, this.projectiles);
    this.enemy.updateGuns(dt, this.player.troops, this.enemy.troops, this.projectiles);
    this.updateProjectiles(dt);
    this.checkWinner();
  },

  /** Stroke every sublane so the 5-wide top and 3-wide U are visible. */
  drawLanes(ctx) {
    const left = CONFIG.playerCapital;
    const right = CONFIG.enemyCapital;

    ctx.fillStyle = CONFIG.colors.topLane;
    ctx.fillRect(
      left.x,
      left.y - CONFIG.topLaneHeight / 2,
      right.x - left.x,
      CONFIG.topLaneHeight,
    );

    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    ctx.strokeStyle = CONFIG.colors.topSublane;
    ctx.lineWidth = CONFIG.topSublaneWidth;
    for (let s = 0; s < CONFIG.topSublaneCount; s += 1) {
      const pts = Path.worldPoints("top", s);
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      ctx.lineTo(pts[1].x, pts[1].y);
      ctx.stroke();
    }

    ctx.strokeStyle = CONFIG.colors.bottomSublane;
    ctx.lineWidth = CONFIG.bottomSublaneWidth;
    const ring = Path.bottomCenter();
    for (let s = 0; s < CONFIG.bottomSublaneCount; s += 1) {
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, Path.bottomRadius(s), Math.PI, 0, true);
      ctx.stroke();
    }

    this.drawQuarterLines(ctx);
    this.drawTopCenter(ctx);
    this.drawBottomCenter(ctx);
  },

  /**
   * Cover bars at 1/4 of the lane from each keep: vertical on top,
   * radial on the bottom rings. Thickness matches a troop.
   */
  quarterSegments() {
    const left = CONFIG.playerCapital;
    const right = CONFIG.enemyCapital;
    const topY = left.y - CONFIG.topLaneHeight / 2;
    const botY = left.y + CONFIG.topLaneHeight / 2;
    const span = right.x - left.x;
    const px = left.x + CONFIG.quarterMark * span;
    const ex = left.x + (1 - CONFIG.quarterMark) * span;
    const c = Path.bottomCenter();
    const rIn = Path.bottomRadius(CONFIG.bottomSublaneCount - 1);
    const rOut = Path.bottomRadius(0);
    const pTheta = Math.PI * (1 - CONFIG.quarterMark);
    const eTheta = Math.PI * CONFIG.quarterMark;
    return [
      { x1: px, y1: topY, x2: px, y2: botY, color: CONFIG.colors.player },
      { x1: ex, y1: topY, x2: ex, y2: botY, color: CONFIG.colors.enemy },
      {
        x1: c.x + rIn * Math.cos(pTheta),
        y1: c.y + rIn * Math.sin(pTheta),
        x2: c.x + rOut * Math.cos(pTheta),
        y2: c.y + rOut * Math.sin(pTheta),
        color: CONFIG.colors.player,
      },
      {
        x1: c.x + rIn * Math.cos(eTheta),
        y1: c.y + rIn * Math.sin(eTheta),
        x2: c.x + rOut * Math.cos(eTheta),
        y2: c.y + rOut * Math.sin(eTheta),
        color: CONFIG.colors.enemy,
      },
    ];
  },

  quarterThickness() {
    return CONFIG.troopRadius * 2;
  },

  touchesQuarterLine(troop) {
    const reach = troop.bodyRadius() + this.quarterThickness() / 2;
    const segs = this.quarterSegments();
    for (let i = 0; i < segs.length; i += 1) {
      const s = segs[i];
      if (pointToSegment(troop, s.x1, s.y1, s.x2, s.y2) <= reach) {
        return true;
      }
    }
    return false;
  },

  drawQuarterLines(ctx) {
    const segs = this.quarterSegments();
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineWidth = this.quarterThickness();
    ctx.globalAlpha = 0.35;
    for (let i = 0; i < segs.length; i += 1) {
      const s = segs[i];
      ctx.strokeStyle = s.color;
      ctx.beginPath();
      ctx.moveTo(s.x1, s.y1);
      ctx.lineTo(s.x2, s.y2);
      ctx.stroke();
    }
    ctx.restore();
  },

  /** Gold cost of living units in one lane. */
  laneArmyValue(side, lane) {
    let total = 0;
    for (let i = 0; i < side.troops.length; i += 1) {
      const troop = side.troops[i];
      if (troop.hp <= 0 || troop.lane !== lane) {
        continue;
      }
      total += side.unitCost(troop.type);
    }
    return total;
  },

  /**
   * One side's push in a lane: each living unit adds progress-from-its
   * keep times its gold cost.
   */
  laneValue(side, lane) {
    let total = 0;
    for (let i = 0; i < side.troops.length; i += 1) {
      const troop = side.troops[i];
      if (troop.hp <= 0 || troop.lane !== lane) {
        continue;
      }
      total += troop.progress * side.unitCost(troop.type);
    }
    return total;
  },

  /**
   * Share of a lane from the player keep. Player value over both
   * sides' values; 0.5 when nobody is on the lane.
   */
  laneCenterT(lane) {
    const playerVal = this.laneValue(this.player, lane);
    const enemyVal = this.laneValue(this.enemy, lane);
    const sum = playerVal + enemyVal;
    if (sum <= 0) {
      return 0.5;
    }
    return playerVal / sum;
  },

  topLaneCenterT() {
    return this.laneCenterT("top");
  },

  bottomLaneCenterT() {
    return this.laneCenterT("bottom");
  },

  /** Vertical divider on the top band at the cost-weighted center. */
  drawTopCenter(ctx) {
    const left = CONFIG.playerCapital;
    const right = CONFIG.enemyCapital;
    const t = this.topLaneCenterT();
    const x = left.x + (right.x - left.x) * t;
    const top = left.y - CONFIG.topLaneHeight / 2;
    const bottom = left.y + CONFIG.topLaneHeight / 2;
    ctx.save();
    ctx.strokeStyle = CONFIG.colors.laneCenter;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, top);
    ctx.lineTo(x, bottom);
    ctx.stroke();
    ctx.restore();
  },

  /** Short ray that only crosses the bottom rings. */
  drawBottomCenter(ctx) {
    const c = Path.bottomCenter();
    const t = this.bottomLaneCenterT();
    const theta = Math.PI * (1 - t);
    const rIn = Path.bottomRadius(CONFIG.bottomSublaneCount - 1);
    const rOut = Path.bottomRadius(0);
    ctx.save();
    ctx.strokeStyle = CONFIG.colors.laneCenter;
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(c.x + rIn * Math.cos(theta), c.y + rIn * Math.sin(theta));
    ctx.lineTo(c.x + rOut * Math.cos(theta), c.y + rOut * Math.sin(theta));
    ctx.stroke();
    ctx.restore();
  },

  /** Brighten the sublane under the cursor during a row-change drag. */
  drawLaneHover(ctx) {
    if (!this.drag || this.drag.troop.hp <= 0) {
      return;
    }
    const troop = this.drag.troop;
    const row = Path.closestSublane(
      troop.side.id,
      troop.lane,
      troop.progress,
      { x: this.drag.hx, y: this.drag.hy },
    );
    ctx.save();
    ctx.strokeStyle = CONFIG.colors.laneHover;
    ctx.globalAlpha = 0.8;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    if (troop.lane === "top") {
      ctx.lineWidth = CONFIG.topSublaneWidth + 6;
      const pts = Path.worldPoints("top", row);
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      ctx.lineTo(pts[1].x, pts[1].y);
      ctx.stroke();
    } else {
      ctx.lineWidth = CONFIG.bottomSublaneWidth + 6;
      const ring = Path.bottomCenter();
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, Path.bottomRadius(row), Math.PI, 0, true);
      ctx.stroke();
    }
    ctx.restore();
  },

  /** Paint the map, checkpoints, keeps, troops, and in-flight shells. */
  render() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
    ctx.fillStyle = CONFIG.colors.bg;
    ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
    this.drawLanes(ctx);
    this.drawLaneHover(ctx);

    for (let i = 0; i < this.checkpoints.length; i += 1) {
      this.checkpoints[i].draw(ctx);
    }
    this.player.drawCapital(ctx);
    this.enemy.drawCapital(ctx);

    const everyone = this.player.troops.concat(this.enemy.troops);
    for (let i = 0; i < everyone.length; i += 1) {
      everyone[i].draw(ctx);
    }
    for (let i = 0; i < this.projectiles.length; i += 1) {
      this.projectiles[i].draw(ctx);
    }
    for (let i = 0; i < this.splats.length; i += 1) {
      this.splats[i].draw(ctx);
    }
    this.drawCanvasUI(ctx);
  },

  /** Banks, scoreboard, and lane buy buttons drawn over the map. */
  drawCanvasUI(ctx) {
    this.player.drawBanks(ctx);
    this.enemy.drawBanks(ctx);
    this.drawScoreboard(ctx);
    this.drawBuyButtons(ctx);
  },

  /** Player and bot stats plus keep score, between the two bank rows. */
  drawScoreboard(ctx) {
    const pLast = this.player.bankButtonRect(CONFIG.bankCount - 1);
    const eFirst = this.enemy.bankButtonRect(0);
    const left = pLast.x + pLast.w + 14 * CONFIG.uiScale;
    const right = eFirst.x - 14 * CONFIG.uiScale;
    const mid = (left + right) / 2;
    const top = pLast.y;
    const midY = top + pLast.h / 2;
    this.drawSideStats(ctx, this.player, left, midY, "left");
    this.drawSideStats(ctx, this.enemy, right, midY, "right");
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = this.uiFont(18);
    ctx.fillStyle = CONFIG.colors.player;
    ctx.fillText(String(Math.round(Math.max(0, this.player.capitalHP))), mid - 28 * CONFIG.uiScale, midY);
    ctx.fillStyle = CONFIG.colors.text;
    ctx.font = this.uiFont(14);
    ctx.fillText("—", mid, midY);
    ctx.fillStyle = CONFIG.colors.enemy;
    ctx.font = this.uiFont(18);
    ctx.fillText(String(Math.round(Math.max(0, this.enemy.capitalHP))), mid + 28 * CONFIG.uiScale, midY);
    ctx.restore();
  },

  drawSideStats(ctx, side, x, midY, align) {
    const gold = Math.floor(side.gold);
    const land = Math.floor(side.land);
    const line1 = `${gold}🪙 +${side.income}/s   ${land}🌿 +${side.landIncome}/s`;
    const line2 = `${side.speedMultiplier.toFixed(2)}x ⚡  ${side.damageScale().toFixed(2)}x ⚔️  ${Math.round(side.armorReduction() * 100)}% 🛡️`;
    ctx.save();
    ctx.textAlign = align;
    ctx.textBaseline = "middle";
    ctx.fillStyle = side.id === "player" ? CONFIG.colors.player : CONFIG.colors.enemy;
    ctx.font = this.uiFont(12);
    ctx.fillText(line1, x, midY - 8 * CONFIG.uiScale);
    ctx.fillStyle = CONFIG.colors.text;
    ctx.font = this.uiFont(11, "normal");
    ctx.fillText(line2, x, midY + 9 * CONFIG.uiScale);
    ctx.restore();
  },

  drawBuyButtons(ctx) {
    const hover = this.hover;
    const over = Boolean(this.winner);
    const lanes = ["top", "bottom"];
    for (let L = 0; L < lanes.length; L += 1) {
      for (let i = 0; i < BUY_UNITS.length; i += 1) {
        const unit = BUY_UNITS[i];
        const box = this.buyButtonRect(lanes[L], i);
        const cost = CONFIG[unit.costKey];
        const can = !over && this.player.gold >= cost;
        const lit = hover
          && hover.x >= box.x && hover.x <= box.x + box.w
          && hover.y >= box.y && hover.y <= box.y + box.h;
        ctx.fillStyle = unit.fill;
        ctx.strokeStyle = can && lit ? "#ffffff" : unit.stroke;
        ctx.lineWidth = 2;
        ctx.globalAlpha = can ? 1 : 0.45;
        ctx.fillRect(box.x, box.y, box.w, box.h);
        ctx.strokeRect(box.x, box.y, box.w, box.h);
        ctx.fillStyle = CONFIG.colors.text;
        ctx.font = this.uiFont(box.h > 26 * CONFIG.uiScale ? 13 : 11);
        ctx.textBaseline = "middle";
        ctx.textAlign = "left";
        ctx.fillText(unit.label, box.x + 6 * CONFIG.uiScale, box.y + box.h / 2);
        ctx.fillStyle = CONFIG.colors.gold;
        ctx.textAlign = "right";
        ctx.fillText(`${cost}🪙`, box.x + box.w - 6 * CONFIG.uiScale, box.y + box.h / 2);
        ctx.globalAlpha = 1;
      }
    }
  },

  /** Frame driver. Caps dt so a tab-switch does not teleport units. */
  loop(now) {
    const dt = Math.min(0.05, (now - this.lastTime) / 1000);
    this.lastTime = now;
    this.tick(dt);
    this.updateSplats(dt);
    this.render();
    requestAnimationFrame((t) => this.loop(t));
  },
};

Game.init();

  </script>
